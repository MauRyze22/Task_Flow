<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div>
        <h1><a href="{% url 'home' %}">Home</a></h1>

    </div>
    
    <div>
        {% if request.user.is_authenticated %}
            <a href="{% url 'logout_user' %}">Logout</a>
            
            <hr>

            <a href="{% url 'equipos' %}">Equipos</a>
            <a href="{% url 'proyectos' %}">Proyectos</a>
            <a href="{% url 'tareas' %}">Tareas</a>
            <a href="{% url 'comentarios' %}">Comentarios</a>
            <a href="{% url 'profile_user' request.user.id %}">Mi perfil</a>

        {% else %}
            <a href="{% url 'login_user' %}">Login</a>
            <hr>
        {% endif %}

    </div>

    <div>
        {% if messages %}
            {% for message in messages %}
                <p>{{message}}</p>
            {% endfor%}
        {% endif %}    
    </div>


    {% block content %}




    {% endblock content %}

    
</body>
</html>
