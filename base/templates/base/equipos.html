{% extends "main.html" %}

{% block content %}

{% if equipos %}

<h1>Mis equipos:</h1>

{% for equipo in equipos %}
    <ul> 
        <li>Equipo <a href="{% url 'equipo_detail' equipo.id %}">#{{equipo.numero}}</a></li>
    
    </ul>
   

{% endfor %}
{% endif %}

{% if request.user.is_authenticated %}
<div>
    <a href="{% url 'create_equipo' %}">Crear Equipo</a>
</div>
{% endif %}

{% endblock content %}
