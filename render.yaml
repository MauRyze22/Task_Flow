services:
  - type: web
    name: taskflow-app
    runtime: python
    plan: free
    branch: main
    buildCommand: './build.sh'
    startCommand: 'gunicorn taskFlow.wsgi:application'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: '.onrender.com'
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflowdb
    user: taskflow_user
